<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AIバズ動画レーダー — 2026-06-25</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  font-size: 15px;
  line-height: 1.6;
}
a { color: #4a9eff; text-decoration: none; }
a:hover { text-decoration: underline; }

/* Header */
.site-header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  border-bottom: 2px solid #e50914;
  padding: 20px 16px 16px;
  text-align: center;
}
.site-header h1 {
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  letter-spacing: 0.05em;
}
.site-header .subtitle {
  color: #aaa;
  font-size: 13px;
  margin-top: 6px;
}
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.stats-bar .stat {
  background: #1e2a3a;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  color: #ccc;
}
.stats-bar .stat strong { color: #fff; }

/* Main */
main {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 12px 40px;
}
.section-title {
  font-size: 16px;
  font-weight: bold;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin: 20px 0 10px;
  padding-left: 4px;
  border-left: 3px solid #e50914;
  padding-left: 10px;
}

/* Card */
.card {
  background: #1a1a1a;
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
  border: 1px solid #2a2a2a;
  position: relative;
}
.card-rank {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  font-size: 14px;
  font-weight: bold;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
}
.rank-gold   { background: rgba(180,140,0,0.9); }
.rank-silver { background: rgba(120,120,120,0.9); }
.rank-bronze { background: rgba(140,80,40,0.9); }

.thumb-link { display: block; }
.thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: #333;
}

.card-body { padding: 14px 14px 16px; }
.card-title {
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 6px;
  line-height: 1.4;
}
.card-title a { color: #e0e0e0; }
.channel { font-size: 13px; color: #888; margin-bottom: 8px; }

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  color: #aaa;
  margin-bottom: 8px;
}
.score { color: #ffd700; font-weight: bold; }

.revenue {
  font-size: 13px;
  color: #7ecb7e;
  margin-bottom: 10px;
}

.analysis-block {
  background: #111;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.analysis-block h3 {
  font-size: 12px;
  font-weight: bold;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 5px;
}
.analysis-block p {
  font-size: 13px;
  color: #ccc;
  white-space: pre-line;
}

.ideas-details {
  margin-bottom: 10px;
}
.ideas-details summary {
  cursor: pointer;
  font-size: 13px;
  color: #4a9eff;
  padding: 6px 0;
  user-select: none;
}
.ideas-list {
  padding-left: 18px;
  margin-top: 6px;
  font-size: 13px;
  color: #ccc;
}
.ideas-list li { margin-bottom: 6px; }
.ideas-list small { color: #888; }

.yt-btn {
  display: block;
  background: #e50914;
  color: #fff;
  text-align: center;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
  text-decoration: none;
}
.yt-btn:hover { background: #c00; text-decoration: none; }

.empty-state {
  text-align: center;
  color: #666;
  padding: 40px 20px;
  font-size: 14px;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #555;
  padding: 20px;
  border-top: 1px solid #222;
}
</style>
</head>
<body>
  <header class="site-header">
    <h1>🤖 AIバズ動画レーダー</h1>
    <p class="subtitle">生成日時: 2026-06-25 23:43 JST</p>
    <div class="stats-bar">
      <div class="stat">収集 <strong>0件</strong></div>
      <div class="stat">分析 <strong>0件</strong></div>
      <div class="stat">掲載 <strong>0件</strong></div>
    </div>
  </header>
  <main>
    <p class="section-title">TOP0 AI動画ランキング</p>
    <div class="empty-state">分析済み動画がありません。</div>
  </main>
  <footer>
    AIバズ動画レーダー &nbsp;|&nbsp; 自動生成レポート &nbsp;|&nbsp; 2026-06-25 23:43 JST
  </footer>
</body>
</html>
